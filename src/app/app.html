<main class="app-shell">
  <p-toast />
  <aside
    class="sidebar"
    [class.collapsed]="sidebarCollapsed()"
    [class.mobile-open]="mobileMenuOpen()"
  >
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon"><i class="pi pi-bolt"></i></div>
        <div class="brand-title">Mordenec</div>
      </div>
      <button class="icon-button" type="button" (click)="toggleSidebar()">
        <i
          class="pi"
          [class.pi-angle-double-left]="!sidebarCollapsed()"
          [class.pi-angle-double-right]="sidebarCollapsed()"
        ></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a
        class="nav-item"
        [routerLink]="'/'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-home"></i>
        <span>Overview</span>
      </a>
      <a
        class="nav-item"
        [routerLink]="'/quiz'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-play"></i>
        <span>Quizzes</span>
      </a>
      <a
        class="nav-item"
        [routerLink]="'/skills'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-chart-bar"></i>
        <span>Skills</span>
      </a>
      <a
        class="nav-item"
        [routerLink]="'/interview'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-microchip-ai"></i>
        <span>Skills</span>
      </a>
      <a class="nav-item" href="#">
        <i class="pi pi-cog"></i>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="avatar">A</div>
        <div class="user-meta">
          <strong>Alice</strong>
          <span>Admin</span>
        </div>
      </div>
    </div>
  </aside>
  @if (mobileMenuOpen()) {
    <div class="mobile-backdrop" (click)="closeSidebar()"></div>
  }

  <div class="content-shell">
    <div class="mobile-toolbar">
      <button class="mobile-toggle" type="button" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>
    </div>
    <div class="page-content">
      <router-outlet />
    </div>
  </div>
</main>
