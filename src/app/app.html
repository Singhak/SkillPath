<main class="app-shell">
  <p-toast />
  <aside
    class="sidebar"
    [class.collapsed]="sidebarCollapsed()"
    [class.mobile-open]="mobileMenuOpen()"
  >
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-icon"><img src="assests/logo.png"/></div>
        <div class="brand-title">{{title()}}</div>
      </div>
      <button class="icon-button" type="button" (click)="toggleSidebar()">
        <i
          class="pi"
          [class.pi-angle-double-left]="!sidebarCollapsed()"
          [class.pi-angle-double-right]="sidebarCollapsed()"
        ></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a
        class="nav-item"
        [routerLink]="'/'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-home"></i>
        <span>Overview</span>
      </a>
      <a
        class="nav-item"
        [routerLink]="'/quiz'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-play"></i>
        <span>Quizzes</span>
      </a>
      <a
        class="nav-item"
        [routerLink]="'/skills'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-bolt"></i>
        <span>Skills</span>
      </a>
      <a
        class="nav-item"
        [routerLink]="'/aiinterview'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="pi pi-microchip-ai"></i>
        <span>AI Interview</span>
      </a>
      <a class="nav-item" href="#">
        <i class="pi pi-cog"></i>
        <span>Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      @if(isAuthenticated()){
        <div class="user-pill">
          <div class="avatar">{{ userInitials() }}</div>
          <div class="user-meta">
            <strong>{{ currentUser()?.name }}</strong>
          </div>
        </div>
        <a class="nav-item logout-link" (click)="logout()" title="Logout">
          <i class="pi pi-sign-out"></i>
          <span>Logout</span>
        </a>
      } @else {
        <a class="nav-item" [routerLink]="'/login'" routerLinkActive="active">
          <i class="pi pi-sign-in"></i>
          <span>Login</span>
        </a>
      }
    </div>
  </aside>
  @if (mobileMenuOpen()) {
    <div class="mobile-backdrop" (click)="closeSidebar()"></div>
  }

  <div class="content-shell">
    <div class="mobile-toolbar">
      <button class="mobile-toggle" type="button" (click)="toggleSidebar()">
        <i class="pi pi-bars"></i>
      </button>
    </div>
    <div class="page-content">
      <router-outlet />
    </div>
  </div>
</main>
