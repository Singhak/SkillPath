<div class="p-4 sm:p-6 lg:p-8">
  <p-card class="max-w-6xl mx-auto">
    @if (!currentQuiz()) {
    <div class="p-4">
      <h2 class="text-2xl font-bold mb-2">Start a New Quiz</h2>
      <p class="text-slate-500 mb-6">Select a category and sub-categories to begin.</p>
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 items-end">
        <span>
          <label for="category">Category</label>
          <p-select class="w-full rounded-xl border-slate-300 bg-white" inputId="category" [options]="categories()"
            [(ngModel)]="selectedCategory" (onChange)="onCategoryChange()" placeholder="Select a Category"></p-select>
        </span>
        <span>
          <label for="subcategories">Sub-Categories</label>
          <p-multiSelect class="w-full rounded-xl border-slate-300 bg-white" inputId="subcategories"
            [options]="subCategories()" [(ngModel)]="selectedSubCategories" placeholder="Select Sub-Categories"
            [style]="{ width: '100%' }"></p-multiSelect>
        </span>
        <span>
          <label>Number of questions</label>
          <p-select class="w-full rounded-xl border-slate-300 bg-white" [ngModel]="questionCount()"
            (ngModelChange)="questionCount.set(+$event)" [options]="questionCountOptions"></p-select>
        </span>
        <p-button label="Start Quiz" icon="pi pi-play" (onClick)="fetchQuiz()"
          [disabled]="!selectedCategory()"></p-button>
      </div>
    </div>
    } @else {
    <!-- Quiz Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4 mb-6">
      <div>
        <div class="text-sm text-slate-500">
          Question {{ currentQuizIndex() + 1 }} of {{ quizes().length }}
        </div>
        <div class="text-xl font-semibold">
          {{ currentQuiz()?.category }} - {{ currentQuiz()?.subCategory }}
        </div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <p-button [label]="timer.time()" icon="pi pi-clock" severity="info" [outlined]="false" [disabled]="true" />
        <p-button [label]="coins().toString()" icon="pi pi-bitcoin" severity="warn" [outlined]="false"
          [disabled]="true" />
        <p-button [label]="'Hint (' + availableHints() + ')'" icon="pi pi-lightbulb" severity="help" [outlined]="false"
          (click)="onHintClick()" [disabled]="isSubmited() || availableHints() === 0" />
        <p-button label="Report" icon="pi pi-flag" severity="warn" (click)="showReportDialog()"></p-button>
      </div>
    </div>

    <!-- Question -->
    <app-quiz [quiz]="currentQuiz()" [index]="currentQuizIndex()" [hintIndex]="hintIndex()"
      [(selectedAnswer)]="selectedAnswer" [showExplanation]="isSubmited()"></app-quiz>

    <!-- Footer -->
    <div class="flex flex-col sm:flex-row justify-between items-center mt-6 gap-4 p-4 bg-slate-50 rounded-lg">
      <div class="text-sm text-green-600 font-medium">
        <i class="pi pi-check-circle mr-1"></i>
        Correct Answer = +5 Coins
      </div>
      <div class="flex gap-2">
        <p-button label="Skip" icon="pi pi-fast-forward" iconPos="right" severity="secondary" (click)="onNextClick()"
          [disabled]="isSubmited()">
        </p-button>
        <p-button label="Submit" icon="pi pi-check" iconPos="right" severity="success" (click)="onSubmitClick()"
          [disabled]="!selectedAnswer().length || isSubmited()">
        </p-button>
        <p-button label="Next" icon="pi pi-arrow-right" iconPos="right" severity="info" [disabled]="!isSubmited()"
          (click)="onNextClick()">
        </p-button>
      </div>
    </div>
    }
  </p-card>
</div>
<app-quiz-summary [visible]="isQuizFinished()" [totalQuestions]="quizesCount()" (close)="onCloseSummary()"
  (restart)="onRestartQuiz()"></app-quiz-summary>
<app-report-issue></app-report-issue>
